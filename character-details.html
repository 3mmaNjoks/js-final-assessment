<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Details</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/00254378fb.js" crossorigin="anonymous"></script>
    <script src="character-details.js" type="module"></script>
</head>
<body>
    <main class="details-page">
        <a class="back-link" href="index.html">
            <i class="fa-solid fa-arrow-left"></i> Back
        </a>

        <section id="loading-state" class="state">
            <div class="spinner"></div>
            <p>Loading character...</p>
        </section>

        <section id="error-state" class="state" hidden>
            <i class="fa-solid fa-triangle-exclamation"></i>
            <p>Could not load this character.</p>
            <p class="error-message"></p>
            <button id="retry">Try again</button>
        </section>

        <section id="details-card" hidden>
            <img class="avatar" src="" alt="">
            <div class="details-body">
                <h2 class="nameplate"></h2>
                <div class="details-grid">
                    <dl class="details-col"></dl>
                    <dl class="details-col"></dl>
                </div>
                <button class="next-character"></button>
            </div>
        </section>
    </main>

    <footer>
        <p>Tech 17 Javascript Final Assessment</p>
        <p>Designed with <i class="fa-solid fa-heart"></i> by <span class="author">Molo</span> for Killamillz</p>
    </footer>
</body>
</html>
